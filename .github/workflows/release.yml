name: release

# 推 v* 的 tag 就自动出安装包并发布；也可以手动触发（只构建上传，不建 tag）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.1'
        required: true
        type: string
      notes:
        description: '更新说明（显示在程序的更新弹窗里）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: 准备 Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          if ($candidates | Where-Object { Test-Path $_ }) {
            Write-Host "镜像里已带 Inno Setup，跳过安装"
            return
          }
          choco install innosetup -y --no-progress

      - name: 构建安装包
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          TAG: ${{ github.ref_name }}
        run: |
          # tag 触发时版本号取 tag 去掉前缀 v；注解 tag 的标题作为更新说明
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
            $notes = $env:INPUT_NOTES
          } else {
            $version = $env:TAG -replace '^v', ''
            $notes = (git tag -l --format='%(contents:subject)' $env:TAG)
            if (-not $notes) { $notes = "NotepadSharp $version" }
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "版本号不合法：'$version'" }
          & ./build.ps1 -Version $version -Notes $notes
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $setup = "artifacts/NotepadSharp-$env:VERSION-setup.exe"
          if (-not (Test-Path $setup)) { throw "找不到 $setup" }
          if (-not (gh release view $tag)) {
            gh release create $tag --title "NotepadSharp $env:VERSION" --notes $env:NOTES --latest
          }
          # latest.json 必须作为附件一起传：程序端读的是 releases/latest/download/latest.json
          gh release upload $tag $setup artifacts/latest.json --clobber
          gh release view $tag
